# Autotest harnesses drive the UI with dynamic attributes by design. Codes merged from their
# legacy per-module entries (union), since mypy rejects a module listed in two override blocks.
[[tool.mypy.overrides]]
module = [
    "gallery_autotest",
    "nav_autotest",
]
disallow_untyped_defs = false
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-overload", "index", "misc", "no-untyped-call", "no-untyped-def", "operator"]

# Platform modules with no usable stubs (Windows COM, macOS bridges, bootstrap worker).
# Codes merged from their legacy per-module entries (union).
[[tool.mypy.overrides]]
module = [
    "platform_support.windows_share",
    "platform_support.display_brightness",
    "bootstrap_pkg.worker",
    "bootstrap_pkg.constants",
]
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-arg", "misc", "no-untyped-def", "type-arg"]

# ---------------------------------------------------------------------------
# Pytest: unit and regression tests.
# Run: python -m pytest tests -q
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]         # Only collect from tests/; never from build or vendored code.
# Tests insert src/ on sys.path themselves, so no pythonpath setting is needed.
# QT_QPA_PLATFORM=offscreen is set inside the test modules that create widgets.

# ---------------------------------------------------------------------------
# Dev tooling (PEP 735). Never shipped in the installer. Mirrored in the pixi `dev` feature.
# Run: python -m pytest tests -q ; python -m mypy ; python -m scripts.typing.ratchet
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.2",
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "libcst==1.9.0",
    "autotyping==24.9.0",
    "MonkeyType==23.3.0",
    "types-psutil==7.2.2.20261122",
    "types-Send2Trash==2.2.0.20261114",
]
