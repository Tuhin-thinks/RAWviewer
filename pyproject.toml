# RAWviewer project configuration.
#
# Every tool section below states what it enforces and why. Rule sets are
# deliberately narrow where the codebase is not yet compliant; the goal is to
# tighten them over time, never to silence new code. See CLAUDE.md for the
# coding standards these settings implement.

[project]
name = "rawviewer"
version = "3.1.1"
description = "RAWviewer - Professional RAW Image Viewer with Semantic Search"
# Supported interpreter range. Code must run on the floor (3.10): no PEP 695
# `type` aliases, no PEP 701 f-string nesting, no 3.12-only stdlib calls.
requires-python = ">=3.10,<3.13"

# ---------------------------------------------------------------------------
# Ruff: linter and formatter (replaces flake8, isort, pyupgrade, black).
# Run: python -m ruff check <paths>   and   python -m ruff format --check <paths>
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120            # Matches the formatter; E501 is ignored because the formatter wraps.
# Target the floor, not 3.12: otherwise UP rules suggest syntax that 3.10 cannot run.
# NOTE: currently "py312" (see audit). Change to "py310" when the team agrees.
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors: syntax-level style problems.
    "W",    # pycodestyle warnings: whitespace, trailing spaces.
    "F",    # pyflakes: unused imports/variables, undefined names.
    "I",    # isort: import blocks sorted and grouped (stdlib / third-party / first-party).
    "B",    # flake8-bugbear: likely bugs (mutable defaults, loop-variable capture, bare raise).
    "C4",   # flake8-comprehensions: avoid needless list()/dict()/set() wrapping.
    "UP",   # pyupgrade: modern syntax for the target version. Includes UP010
            # (unnecessary `from __future__` imports) and UP006/UP007/UP035 (PEP 585/604 typing).
    "SIM",  # flake8-simplify: collapsible if/else, needless bool returns, contextlib.suppress.
]
ignore = [
    "E501",  # Line length: left to the formatter.
    "UP040", # PEP 695 `type X = ...` aliases need 3.12; the floor is 3.10, so keep TypeAlias.
]
# Not enabled yet, planned: "RUF" (ruff-specific), "ANN" (annotations; overlaps mypy),
# "D" (docstrings), "PL" (pylint), "N" (naming). Each needs a baseline pass first.

[tool.ruff.format]
quote-style = "double"        # Consistent with PEP 8 default and the existing code.
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Each entry is a file that has a justified reason, not a general exemption.
# F401 (unused import): package __init__ files re-export names on purpose.
"src/search/indexer/__init__.py" = ["F401"]
"src/raw_adjustments/__init__.py" = ["F401"]
"src/bootstrap_pkg/__init__.py" = ["F401"]
"src/enhanced_raw_processor/__init__.py" = ["F401"]
"src/rawviewer_ui/widgets/gpu/__init__.py" = ["F401"]
"src/cache/image_cache/__init__.py" = ["F401"]
"src/rawviewer_app/processing/__init__.py" = ["F401"]
# E402 (import not at top): these modules set sys.path, env vars or Qt/OpenMP flags before importing.
"src/main.py" = ["E402"]
"src/raw_adjustments/pipeline.py" = ["E402"]
"src/core/release_update.py" = ["E402"]
"src/common_image_loader/loaders.py" = ["E402"]
"src/common_image_loader/mipmap.py" = ["E402"]
"src/metadata/backend.py" = ["E402"]
"src/processing/unified/helpers.py" = ["E402"]
"src/rawviewer_app/window/mixins/metadata_part2.py" = ["E402"]
"src/rawviewer_ui/widgets/adjust/adjust_part4.py" = ["E402"]
"src/bootstrap_pkg/helpers.py" = ["E402"]

# ---------------------------------------------------------------------------
# Mypy: static type checking.
# Run: python -m mypy <paths>
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"       # Checker dialect: matches the supported floor.
files = ["src", "scripts", "testplan", "tests", "build.py"]
mypy_path = "src:typings"     # Local stubs (typings/) plus the src/ package root.
explicit_package_bases = true # Module names are computed from the repo root, so scripts/ and tests/ import cleanly.
strict = true                 # Turns on all strict flags below plus the rest of --strict.
allow_subclassing_any = true  # PyQt6 base classes are untyped; subclassing them must not error.
warn_return_any = true        # Flag `return x` where x is Any in a function declared to return a concrete type.
warn_unused_ignores = true    # A `# type: ignore` that no longer hides an error is itself an error.
disallow_untyped_defs = true  # Every function needs parameter and return annotations.
disallow_incomplete_defs = true  # Partially annotated signatures are errors.

# Test and script code may be lighter-typed. Loosened per module, never globally.
[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

# Third-party packages without stubs: treat as Any instead of erroring on import.
[[tool.mypy.overrides]]
module = [
    "objc",
    "AppKit",
    "Foundation",
    "Quartz",
    "CoreML",
    "Vision",
    "comtypes",
    "comtypes.*",
    "cupy",
    "cupy.*",
    "torch",
    "torch.*",
    "kornia",
    "kornia.*",
    "onnxruntime",
    "onnxruntime.*",
    "lensfunpy",
    "pyexiv2",
    "qtawesome",
]
ignore_missing_imports = true

# Legacy per-module error codes. Generated by: python -m scripts.typing.ledger --emit-overrides
# Each module lists exactly the codes it still has. Delete a module's line when it reaches zero
# errors; delete the whole block when the list is empty. Never add a module here.
# Ratchet: python -m scripts.typing.ratchet (counts may only go down).
[[tool.mypy.overrides]]
module = [
    "rawviewer_app.window.mixins.adjust_part1",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-arg", "no-any-return", "no-untyped-call", "no-untyped-def", "union-attr", "var-annotated"]

